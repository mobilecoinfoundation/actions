name: Install SGX SDK
description: Installs the Intel SGX SDK (and propagates environment variables)
inputs:
  version:
    description: "The version of the SDK to install"
    required: false
    default: "2.17.101.1"
  release:
    description: "Intel release directory; defaults to the first two components of version"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install SGX SDK
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.version }}
        SDK_RELEASE: ${{ inputs.release }}
      # In order to propagate the environment variables to subsequent steps we
      # need to redirect through $GITHUB_ENV, see
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
      # We can't do `cat /opt/intel/sgxsdk/environment >> $GITHUB_ENV` because
      # the environment file has _logic_ which the `GITHUB_ENV` parser will
      # fail on.  So we manually pass on the known environment variables.
      run: |
        set -eo pipefail
        source /etc/lsb-release
        release="${SDK_RELEASE:-$(cut -d '.' -f1-2 <<< "$SDK_VERSION")}"
        base_url="https://download.01.org/intel-sgx/sgx-linux/$release"
        distro_path="distro/ubuntu${DISTRIB_RELEASE}-server"
        installer_path="$distro_path/sgx_linux_x64_sdk_${SDK_VERSION}.bin"
        manifest="SHA256SUM_linux_${release}.cfg"

        download_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/sgxsdk.XXXXXX")"
        trap 'rm -rf "$download_dir"' EXIT
        cd "$download_dir"
        mkdir -p "$distro_path"
        curl --fail --location --silent --show-error --retry 3 \
          "$base_url/$installer_path" --output "$installer_path"
        curl --fail --location --silent --show-error --retry 3 \
          "$base_url/$manifest" --output "$manifest"
        awk -v installer_path="$installer_path" '
          $2 == installer_path { print; found = 1 }
          END {
            if (!found) {
              print "SDK installer is missing from the checksum manifest: " installer_path > "/dev/stderr"
              exit 1
            }
          }
        ' "$manifest" | sha256sum --check --strict -

        chmod +x "$installer_path"
        "./$installer_path" --prefix=/opt/intel
        source /opt/intel/sgxsdk/environment
        echo "SGX_SDK=$SGX_SDK" >> "$GITHUB_ENV"
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
